# One source tree, two published sites.
#
#   blog.ekamekas.dev  ->  GitHub Pages      (hugo --environment blog)
#   ekamekas.dev       ->  Cloudflare Pages  (hugo --environment landing)
#
# Both are built once, in the same job, so Hugo and the content submodule are
# only fetched a single time. Deployment is split so a failure on one host
# cannot take the other site down with it.
name: Deploy blog and landing

on:
  push:
    branches:
      - main

  # Build (but do not deploy) pull requests, so changes can be reviewed
  # before they reach production.
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb          
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build blog
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          TZ: Asia/Jakarta
        run: |
          hugo \
            --environment blog \
            --destination public \
            --gc \
            --minify \
            --noBuildLock \
            --printPathWarnings \
            --baseURL "${{ steps.pages.outputs.base_url || 'https://blog.ekamekas.dev' }}/"          

      - name: Build landing
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          TZ: Asia/Jakarta
        run: |
          hugo \
            --environment landing \
            --destination public-landing \
            --gc \
            --minify \
            --noBuildLock \
            --printPathWarnings          

      - name: Upload blog (deploy)
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Upload blog (pull request preview)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: blog-preview
          path: ./public

      - name: Upload landing
        uses: actions/upload-artifact@v4
        with:
          name: landing
          path: ./public-landing

  deploy-blog:
    # Pull requests build for review only; never deploy from them.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-landing:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download landing
        uses: actions/download-artifact@v4
        with:
          name: landing
          path: ./public-landing

      # The Cloudflare credentials are not set until the one-time setup in
      # README.md is done. Until then this step is skipped rather than failing
      # the run and masking the blog's own result. `secrets` is not available
      # in a job-level `if`, so the guard has to live on the step.
      - name: Check for Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping the ekamekas.dev deploy. See README.md."
          fi          

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public-landing --project-name=ekamekas-dev --branch=main
