<div class="post-meta">
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time>
  <span class="sep" aria-hidden="true">&middot;</span>
  <span class="reading-time">{{ i18n "readingTime" .ReadingTime }}</span>
  {{- if .Draft }} <span class="draft-label">DRAFT</span>{{ end }}
</div>
