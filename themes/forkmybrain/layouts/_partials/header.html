<header class="site-header wrap">
  <div class="site-id">
    <a class="site-title" href="{{ "/" | relLangURL }}">{{ site.Title }}</a>
  </div>
  <nav class="site-nav" aria-label="{{ i18n "mainNav" }}">
    {{- range partial "menu-items.html" . }}
    {{- $active := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
    {{- /* .Page.RelPermalink, not the raw pageRef: the ref has no trailing
           slash, so every rubrik link cost the reader a redirect. */}}
    <a href="{{ with .Page }}{{ .RelPermalink }}{{ else }}{{ .URL }}{{ end }}"
       {{ if $active }}aria-current="page"{{ end }}>{{ .Name }}</a>
    {{- end }}
    <button type="button" id="theme-toggle" class="theme-toggle"
            aria-label="{{ i18n "toggleTheme" }}" title="{{ i18n "toggleTheme" }}">
      <span class="theme-toggle-icon" aria-hidden="true"></span>
    </button>
  </nav>
</header>
