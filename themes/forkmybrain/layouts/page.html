{{ define "main" }}
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    {{ partial "post-meta.html" . }}
    {{- with .Description }}<p class="post-description">{{ . }}</p>{{ end }}
  </header>
  {{ partial "toc.html" . }}
  <div class="prose">
    {{ .Content }}
  </div>
  {{ partial "tags.html" . }}
</article>
{{ partial "post-nav.html" . }}
{{ partial "related.html" . }}
{{ end }}
