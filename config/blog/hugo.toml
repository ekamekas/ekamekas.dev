# blog.ekamekas.dev — deployed to GitHub Pages.
# Build: hugo --environment blog
#
# Shared settings (language, timezone, author, socials) live in
# config/_default/hugo.toml.

# =============================================================================
# Site identity
# =============================================================================
baseURL = 'https://blog.ekamekas.dev/'
title   = 'Fork My Brain'
theme   = 'forkmybrain'

enableRobotsTXT = true
summaryLength   = 40

# =============================================================================
# Files & mounts
# =============================================================================
# Explicit mounts instead of the legacy staticDir list.
#
# WHY: `staticDir = ['static', 'content/static']` silently mounted only the
# first entry -- Hugo dropped content/static, taking the public key and all
# five post diagrams with it. Declaring mounts is unambiguous.
#
# Declaring any [[module.mounts]] replaces the project's default mounts, so the
# full set is spelled out here.
# Rubrik are mounted one by one rather than mounting content/ wholesale.
# Mounting the whole directory also swept in content/static -- which is mounted
# again below as STATIC -- so every diagram and the public key were published
# twice, at / and at /static/. It swept in content/README.md too.
# ('files = [..., "!static/**"]' does not help: glob negation is not honoured
# there. 'excludeFiles' does, but was deprecated in Hugo v0.153.0.)
# A new rubrik needs a line here, plus params.mainSections and a menu entry.
[[module.mounts]]
  source = 'content/engineering'
  target = 'content/engineering'

[[module.mounts]]
  source = 'content/ulasan'
  target = 'content/ulasan'

[[module.mounts]]
  source = 'content/catatan'
  target = 'content/catatan'

[[module.mounts]]
  source = 'static'
  target = 'static'

# Contents land at the site ROOT, so content/static/ekamekas.dev.pub publishes
# to /ekamekas.dev.pub and the post diagrams keep their /<file>.svg URLs.
[[module.mounts]]
  source = 'content/static'
  target = 'static'

[[module.mounts]]
  source = 'assets'
  target = 'assets'

[[module.mounts]]
  source = 'layouts'
  target = 'layouts'

[[module.mounts]]
  source = 'i18n'
  target = 'i18n'

[[module.mounts]]
  source = 'data'
  target = 'data'

[[module.mounts]]
  source = 'archetypes'
  target = 'archetypes'

# =============================================================================
# Taxonomies
# =============================================================================
[taxonomies]
  # 'categories' was on by Hugo default but unused, producing an empty page.
  tag = 'tags'

  # A series is a run that continues -- 'Learn Zig #1' implies a #2. It used to
  # be encoded twice, as a title prefix and as a tag, and neither gave it a
  # page or an ordering. Rubrik names ('Cloud Engineering', 'Database
  # Engineering') are NOT series: those are sections now.
  series = 'series'

[pagination]
  pagerSize = 10

# Default og:image for every page, with no content edits. There are no cover
# images anywhere in the content repo.
[[cascade]]
  [cascade.params]
    images = ['/og-default.png']
  [cascade.target]
    path = '/**'

# =============================================================================
# Markup
# =============================================================================
[markup]
  [markup.highlight]
    # Replaces the legacy pygmentsstyle / pygmentscodefences /
    # pygmentscodefencesguesssyntax keys. noClasses=false is the point: with
    # the default (true) Chroma baked monokai into inline style= attributes, so
    # code blocks could never follow light/dark.
    noClasses          = false
    style              = 'github'
    codeFences         = true
    guessSyntax        = false   # ~11 unlabelled fences were being mis-lexed
    lineNos            = false
    tabWidth           = 4
    wrapperClass       = 'highlight'

  [markup.tableOfContents]
    # MANDATORY companion to layouts/_markup/render-heading.html.
    # .TableOfContents is built from the goldmark AST at the ORIGINAL heading
    # levels, which render hooks do not touch. Posts use `#` as their section
    # level, so the default startLevel=2 yielded an EMPTY TOC on 5 of 8 posts.
    startLevel = 1
    endLevel   = 3
    ordered    = false

  [markup.goldmark.renderer]
    unsafe = false   # verified: no raw HTML in any post

  [markup.goldmark.parser]
    autoHeadingID = true

  [markup.goldmark.parser.attribute]
    block = true
    title = true

  [markup.goldmark.extensions]
    linkify       = true
    strikethrough = true
    table         = true
    taskList      = true
    typographer   = true

  [markup.goldmark.extensions.footnote]
    enable = true

# =============================================================================
# Related posts -- 8 posts across a handful of subject tags.
# Hugo requires a COMPLETE block here; you cannot partially override defaults.
# =============================================================================
[related]
  threshold    = 60      # default 80 is too strict for a corpus this small
  includeNewer = true
  toLower      = true

  # Ranked above tags: two parts of the same series are related by definition,
  # which a shared subject tag only suggests.
  [[related.indices]]
    name   = 'series'
    weight = 120

  [[related.indices]]
    name   = 'tags'
    weight = 100

  [[related.indices]]
    name   = 'date'
    weight = 10

# =============================================================================
# Params
# =============================================================================
# mathjax / katex REMOVED: no post contains any math notation, and the two of
# them together were loading ~360 KB of dead JS/CSS on every page view.
[params]
  # Every rubrik feeds the front page. Without this Hugo guesses a single
  # section and the rest silently vanish from it.
  mainSections = ['engineering', 'ulasan', 'catatan']

  # Was 'Sekedar software engineering' -- no longer true now that the blog has
  # room for ulasan and catatan.
  subtitle    = 'Apa yang ada di kepala, saat ingin menulis, ku tulis di sini. Sebagian soal kode, sebagiannya lagi di luar itu. Ditulis dengan 10 jari, vim, dan <3.'
  description = 'Catatan software engineering, ulasan, dan hal-hal di luar kode. Ditulis dengan 10 jari, vim, dan <3.'
  images      = ['/og-default.png']

# =============================================================================
# Menu
# =============================================================================
# Rubrik entries use pageRef, which lets layouts/_partials/header.html drop the
# ones whose section has no posts yet. Add a post to content/ulasan/ and the
# link appears on its own.
[[menu.main]]
  name    = 'Engineering'
  pageRef = '/engineering'
  weight  = 1

[[menu.main]]
  name    = 'Ulasan'
  pageRef = '/ulasan'
  weight  = 2

[[menu.main]]
  name    = 'Catatan'
  pageRef = '/catatan'
  weight  = 3

[[menu.main]]
  name    = 'Tags'
  pageRef = '/tags'
  weight  = 4

[[menu.main]]
  name   = 'Profil'
  url    = 'https://ekamekas.dev/'
  weight = 5
